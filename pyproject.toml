[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-test-poc"
version = "0.2.0"
description = "Python zero-code UI test contract runner for Codex and Playwright MCP workflows"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "playwright>=1.58,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ui-test = "ui_test_poc.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
addopts = "-q -p no:cacheprovider"

